[package]
name = "stretch-and-water-poc"
version = "0.5.1"
edition = "2021"
description = "Stretch & Water para macOS"
rust-version = "1.85"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri = { version = "~2.12.5", features = ["tray-icon", "unstable"] }
tokio = { version = "1", features = ["time"] }

[features]
default = []
test-profile = []
